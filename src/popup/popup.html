<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrowserGuard</title><link rel="stylesheet" href="../ui/common.css"><link rel="stylesheet" href="popup.css"></head><body>
<main>
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 19 5.7v5.7c0 4.2-3 7.3-7 8.6-4-1.3-7-4.4-7-8.6V5.7L12 3Z"/><path d="m9 11.8 2.2 2.3 4.1-4.2"/></svg></span><span>BrowserGuard<small>Security companion</small></span></div>
    <span id="status" class="pill">Checking…</span>
  </header>

  <section class="site" aria-label="Current site status">
    <div class="site-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 19 5.7v5.7c0 4.2-3 7.3-7 8.6-4-1.3-7-4.4-7-8.6V5.7L12 3Z"/><path d="m9 11.8 2.2 2.3 4.1-4.2"/></svg></div>
    <div class="site-copy"><div class="eyebrow">Current site</div><strong id="domain">Checking current tab…</strong><div id="risk" class="muted">Checking URL signals…</div></div>
    <div id="risk-basis" class="muted small" hidden></div><ul id="risk-reasons" hidden></ul><div class="site-actions"><button id="trust" class="chip" type="button" aria-pressed="false" hidden>Trust this site</button></div>
  </section>

  <section class="stats" aria-label="Protection statistics"><div><strong id="ads-count">—</strong><span>Ads blocked</span></div><div><strong id="trackers-count">—</strong><span>Trackers blocked</span></div><div><strong id="threats-count">—</strong><span>Threats stopped</span></div></section>
  <p id="counter-note" class="muted small">Confirmed blocks across your browsing.</p><p id="youtube-note" class="muted small" hidden>YouTube assist is active on YouTube.</p>

  <section class="controls"><div class="section-title"><span>Protection</span><small>Enabled features</small></div><label class="switch-row"><span><b>Ad blocking</b><small>Block ad requests</small></span><input data-setting="ads" type="checkbox"></label><label class="switch-row"><span><b>Tracker blocking</b><small>Reduce cross-site tracking</small></span><input data-setting="trackers" type="checkbox"></label><label class="switch-row"><span><b>Phishing checks</b><small>Spot risky web addresses</small></span><input data-setting="phishing" type="checkbox"></label><label class="switch-row"><span><b>Malicious-site checks</b><small>Use the local threat feed</small></span><input data-setting="malicious" type="checkbox"></label><label class="switch-row youtube-setting"><span><b>YouTube ad assist</b><small>Skip detected ads</small></span><input data-setting="youtubeAdvance" type="checkbox"></label></section>

  <div class="btn-row actions"><button id="scan" class="btn primary">Scan this site</button><button id="check-link" class="btn">Check link</button><button id="details" class="btn">History</button><button id="dashboard" class="btn">Dashboard</button></div><p id="message" role="status"></p>
</main><script type="module" src="popup.js"></script></body></html>
