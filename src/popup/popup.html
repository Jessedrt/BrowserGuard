<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrowserGuard</title><link rel="stylesheet" href="../ui/common.css"><link rel="stylesheet" href="popup.css"></head><body>
<main><header><div class="brand"><span class="brand-mark">◆</span><span>BrowserGuard</span></div><span id="status" class="pill good">Protection active</span></header>
<section class="card site"><div class="eyebrow">Current site</div><strong id="domain">Checking current tab…</strong><div id="risk" class="muted">Run a scan to inspect the URL.</div></section>
<section class="stats"><div class="card"><strong id="ads-count">0</strong><span>Ads blocked</span></div><div class="card"><strong id="trackers-count">0</strong><span>Trackers blocked</span></div><div class="card"><strong id="threats-count">0</strong><span>Threats blocked</span></div></section>
<p id="counter-note" class="muted small">Counters record confirmed rule matches in this unpacked demo.</p>
<section class="card controls"><div class="eyebrow">Protection controls</div><label class="switch-row">Ad blocking<input data-setting="ads" type="checkbox"></label><label class="switch-row">Tracker blocking<input data-setting="trackers" type="checkbox"></label><label class="switch-row">Phishing protection<input data-setting="phishing" type="checkbox"></label><label class="switch-row">Malicious site protection<input data-setting="malicious" type="checkbox"></label></section>
<div class="btn-row actions"><button id="scan" class="btn primary">Scan current site</button><button id="details" class="btn">View details</button><button id="dashboard" class="btn">Open dashboard</button></div><p id="message" role="status"></p>
</main><script type="module" src="popup.js"></script></body></html>
